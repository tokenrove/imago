name: CI

on: [push, pull_request]

jobs:
  test:
    name: alternative I/O = ${{ matrix.altio }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        altio: [YES, NO]
    env:
      WITH_ALTIO: ${{ matrix.altio }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install libturbojpeg0-dev libffi-dev libheif-dev build-essential
      - name: Install roswell
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
      - name: Install qlot
        run: |
          ros install qlot
      - name: Set Path
        run: |
          echo "${HOME}/.roswell/bin" >> $GITHUB_PATH
      - name: Run tests
        run: |
          cd $GITHUB_WORKSPACE
          qlot install
          qlot exec ros dynamic-space-size=8gb -l tests/travis.lisp
